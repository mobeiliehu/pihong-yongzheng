<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批红 · 雍正十三年</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="批红">
<meta name="theme-color" content="#8b0000">
<style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes seal { 0% { transform: rotate(-10deg) scale(0); opacity: 0; } 50% { transform: rotate(5deg) scale(1.1); } 100% { transform: rotate(0deg) scale(1); opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    @keyframes glowPulse { 0%,100% { box-shadow: 0 0 0 rgba(212,175,55,0); } 50% { box-shadow: 0 0 18px rgba(212,175,55,.45); } }
    :root {
        --imperial-red: #8b0000;
        --imperial-gold: #d4af37;
        --paper-bg: #faf8f0;
        --ink-black: #1a1a1a;
        --seal-red: #c41e3a;
        --jade: #2e6b5e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: "STKaiti", "KaiTi", "SimSun", serif;
        background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        color: var(--ink-black);
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
    }
    body::before {
        content: '';
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        background:
            radial-gradient(circle at 20% 30%, rgba(212,175,55,0.10) 0%, transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(139,0,0,0.10) 0%, transparent 50%);
        pointer-events: none; z-index: 0;
    }
    .container { max-width: 1180px; margin: 0 auto; padding: 32px 20px 80px; position: relative; z-index: 1; }

    /* ---------- 开场 ---------- */
    .splash {
        position: fixed; inset: 0; z-index: 50;
        background: radial-gradient(circle at 50% 40%, #3a2b12 0%, #141414 70%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; text-align: center; padding: 30px;
    }
    .splash h1 {
        font-size: 3.6em; letter-spacing: 16px;
        background: linear-gradient(135deg, var(--imperial-red) 0%, var(--imperial-gold) 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        animation: float 3s ease-in-out infinite;
    }
    .splash .sub { color: var(--imperial-gold); font-size: 1.15em; letter-spacing: 6px; line-height: 2; }
    .splash .hint { color: rgba(250,248,240,.65); font-size: .95em; line-height: 1.9; max-width: 640px; }
    .splash button {
        margin-top: 12px; padding: 14px 52px; font-size: 1.15em; cursor: pointer;
        font-family: inherit; letter-spacing: 6px;
        background: linear-gradient(135deg, var(--imperial-red) 0%, #a51a1a 100%);
        color: var(--imperial-gold); border: 2px solid var(--imperial-gold); border-radius: 8px;
        transition: all .3s;
    }
    .splash button:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(212,175,55,.4); }
    .splash.hidden { display: none !important; }
    #pwa-install { position: fixed; right: 14px; bottom: 14px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; font-family: inherit; }
    #pwa-install button { padding: 9px 16px; border-radius: 999px; border: 2px solid var(--imperial-gold); background: rgba(26,26,26,.92); color: var(--imperial-gold); font-size: 13px; letter-spacing: 2px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.45); }
    #pwa-install button:hover { background: rgba(45,45,45,.95); transform: translateY(-2px); }
    #pwa-install .tip { max-width: 260px; background: rgba(26,26,26,.92); border: 1px solid var(--imperial-gold); color: #f0ece0; border-radius: 10px; padding: 9px 13px; font-size: 12.5px; line-height: 1.75; }
    .alt-games { margin-top: 16px; font-size: .9em; color: rgba(250,248,240,.6); }
    .alt-games a { color: var(--imperial-gold); text-decoration: none; border-bottom: 1px dotted rgba(212,175,55,.6); }
    .alt-games a:hover { color: #fff; }

    /* ---------- 头部 ---------- */
    header { text-align: center; padding: 34px 20px 18px; animation: fadeIn .8s ease-out; }
    h1.title {
        font-size: 3.2em;
        background: linear-gradient(135deg, var(--imperial-red) 0%, var(--imperial-gold) 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        margin-bottom: 10px; letter-spacing: 14px;
    }
    .subtitle { color: var(--imperial-gold); font-size: 1.05em; letter-spacing: 3px; text-shadow: 0 2px 10px rgba(0,0,0,.5); }

    /* ---------- 时间 / 进度 ---------- */
    .timeline-bar {
        display: flex; align-items: center; justify-content: center; gap: 14px;
        margin: 22px 0 8px; flex-wrap: wrap;
    }
    .year-display {
        font-size: 1.5em; color: var(--imperial-gold); font-weight: bold;
        text-shadow: 0 0 20px rgba(212,175,55,.45);
    }
    .progress-wrap { width: 100%; max-width: 620px; margin: 6px auto 26px; }
    .progress-track { height: 8px; background: rgba(255,255,255,.10); border-radius: 4px; overflow: hidden; border: 1px solid rgba(212,175,55,.35); }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--imperial-red), var(--imperial-gold)); transition: width .5s ease; }
    .progress-label { text-align: center; color: rgba(212,175,55,.8); font-size: .85em; letter-spacing: 2px; margin-top: 6px; }

    /* ---------- 数值面板 ---------- */
    .stats-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 16px; margin-bottom: 26px; animation: fadeIn .8s ease-out .2s both; }
    .stat-card {
        background: linear-gradient(135deg, rgba(250,248,240,.95) 0%, rgba(255,255,255,.9) 100%);
        border: 2px solid var(--imperial-gold); border-radius: 12px; padding: 16px;
        text-align: center; transition: all .35s; box-shadow: 0 8px 20px rgba(0,0,0,.3);
    }
    .stat-card:hover { transform: translateY(-6px) scale(1.03); box-shadow: 0 12px 30px rgba(212,175,55,.35); }
    .stat-card.danger { border-color: var(--seal-red); animation: glowPulse 1.8s ease-in-out infinite; }
    .stat-label { font-size: .88em; color: var(--imperial-red); margin-bottom: 6px; font-weight: bold; letter-spacing: 2px; }
    .stat-value { font-size: 1.55em; font-weight: bold; background: linear-gradient(135deg, var(--imperial-red) 0%, var(--imperial-gold) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .stat-bar { width: 100%; height: 6px; background: rgba(0,0,0,.1); border-radius: 3px; margin-top: 8px; overflow: hidden; }
    .stat-bar-fill { height: 100%; background: linear-gradient(90deg, var(--imperial-red), var(--imperial-gold)); border-radius: 3px; transition: width .5s ease-out; }

    /* ---------- 改革进度 ---------- */
    .reform-panel {
        background: rgba(26,26,26,.75); border: 2px solid var(--imperial-gold); border-radius: 12px;
        padding: 18px 22px; margin-bottom: 26px;
    }
    .reform-panel h3 { color: var(--imperial-gold); font-size: 1.05em; letter-spacing: 3px; margin-bottom: 14px; text-align: center; font-weight: normal; }
    .reform-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .reform-name { color: #f0ece0; width: 92px; font-size: .95em; flex: none; }
    .reform-track { flex: 1; height: 12px; background: rgba(255,255,255,.08); border-radius: 6px; overflow: hidden; }
    .reform-fill { height: 100%; width: 0%; border-radius: 6px; transition: width .6s ease; background: linear-gradient(90deg, #6b3b1a, var(--imperial-gold)); }
    .reform-num { color: var(--imperial-gold); width: 46px; text-align: right; font-size: .9em; flex: none; }

    /* ---------- 人物面板 ---------- */
    .people-panel { background: rgba(26,26,26,.75); border: 2px solid var(--imperial-gold); border-radius: 12px; padding: 18px 22px; margin-bottom: 26px; }
    .people-panel h3 { color: var(--imperial-gold); font-size: 1.05em; letter-spacing: 3px; margin-bottom: 14px; text-align: center; font-weight: normal; }
    .people-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 22px; }
    .person { display: flex; align-items: center; gap: 10px; }
    .person-name { width: 92px; flex: none; color: #f0ece0; font-size: .95em; }
    .person-track { flex: 1; height: 10px; background: rgba(255,255,255,.08); border-radius: 5px; position: relative; overflow: hidden; }
    .person-track::before { content:''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(212,175,55,.35); }
    .person-fill { position: absolute; top: 0; bottom: 0; border-radius: 5px; transition: all .6s ease; }
    .person-fill.pos { background: linear-gradient(90deg, rgba(212,175,55,.35), var(--imperial-gold)); }
    .person-fill.neg { background: linear-gradient(90deg, var(--seal-red), rgba(196,30,58,.4)); }
    .person-val { width: 44px; text-align: right; font-size: .88em; flex: none; color: var(--imperial-gold); }
    .person-val.neg { color: #e8788c; }

    /* ---------- 奏折 ---------- */
    .memorial-card {
        background: var(--paper-bg); border: 3px solid var(--imperial-gold); border-radius: 16px;
        padding: 34px; margin-bottom: 26px; box-shadow: 0 15px 40px rgba(0,0,0,.5);
        position: relative; animation: slideIn .5s ease-out;
    }
    .memorial-card::before {
        content: '奏'; position: absolute; top: -20px; right: 40px;
        width: 58px; height: 58px; background: var(--seal-red); color: var(--imperial-gold);
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        font-size: 1.7em; font-weight: bold; border: 3px solid var(--imperial-gold);
        box-shadow: 0 5px 15px rgba(196,30,58,.6); animation: seal .8s cubic-bezier(.68,-.55,.265,1.55);
    }
    .memorial-meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid var(--imperial-gold); padding-bottom: 16px; margin-bottom: 16px; }
    .memorial-from { color: var(--imperial-red); font-size: 1.05em; font-weight: bold; }
    .memorial-date { color: #8a7f66; font-size: .9em; letter-spacing: 1px; }
    .memorial-title { font-size: 1.45em; font-weight: bold; margin-bottom: 10px; letter-spacing: 2px; }
    .memorial-summary { color: #666; font-style: italic; line-height: 1.8; border-left: 3px solid rgba(212,175,55,.7); padding-left: 12px; }
    .memorial-body { margin: 22px 0; line-height: 2.15; text-indent: 2em; white-space: pre-wrap; font-size: 1.05em; color: #262626; }
    .zhupi { background: linear-gradient(135deg, #ffe4e1 0%, #ffd4d4 100%); border-left: 5px solid var(--seal-red); padding: 18px 20px; margin: 18px 0; border-radius: 8px; }
    .zhupi-label { font-weight: bold; color: var(--seal-red); margin-bottom: 6px; letter-spacing: 2px; }
    .zhupi-text { color: var(--seal-red); font-size: 1.15em; font-weight: bold; line-height: 1.95; }
    .mize { background: linear-gradient(135deg, #f2f0ea 0%, #e3e0d6 100%); border-left: 5px solid #555; padding: 18px 20px; margin: 18px 0; border-radius: 8px; display: none; }
    .mize.revealed { display: block; animation: fadeIn .4s ease-out; }
    .mize-label { font-weight: bold; color: #444; margin-bottom: 6px; letter-spacing: 2px; }
    .mize-text { color: #333; line-height: 1.95; }
    .reveal-btn {
        display: inline-block; padding: 10px 22px; margin: 6px 0;
        background: linear-gradient(135deg, #4a4a4a 0%, #6e6e6e 100%); color: #f5f2e8;
        border: 1px solid #333; border-radius: 6px; cursor: pointer; font-size: .98em; font-family: inherit;
        transition: all .3s;
    }
    .reveal-btn:hover { background: linear-gradient(135deg, #3c3c3c 0%, #5c5c5c 100%); transform: translateY(-2px); }
    .options { margin-top: 26px; }
    .option-btn {
        display: block; width: 100%; padding: 18px 24px; margin: 12px 0;
        background: linear-gradient(135deg, rgba(250,248,240,.92) 0%, rgba(255,255,255,.82) 100%);
        border: 3px solid var(--imperial-gold); border-radius: 12px; cursor: pointer;
        transition: all .35s; text-align: left; font-size: 1.05em; color: var(--ink-black);
        font-family: inherit; box-shadow: 0 5px 15px rgba(0,0,0,.2);
    }
    .option-btn:hover { background: linear-gradient(135deg, #fffdf7 0%, #fff6ea 100%); border-color: var(--imperial-red); transform: translateX(10px); }
    .option-label { font-weight: bold; font-size: 1.15em; color: var(--imperial-red); }
    .option-hint { color: #777; font-size: .88em; margin-top: 6px; line-height: 1.7; }

    /* ---------- 记事 ---------- */
    .log-panel {
        background: linear-gradient(135deg, rgba(26,26,26,.9) 0%, rgba(45,45,45,.85) 100%);
        border: 2px solid var(--imperial-gold); border-radius: 12px; padding: 22px;
        margin-top: 34px; max-height: 380px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,.6);
    }
    .log-panel h3 { color: var(--imperial-gold); font-size: 1.05em; letter-spacing: 3px; margin-bottom: 12px; font-weight: normal; }
    .log-entry { padding: 10px 0; border-bottom: 1px dashed rgba(212,175,55,.3); color: var(--imperial-gold); font-size: .96em; line-height: 1.8; }
    .log-entry:last-child { border-bottom: none; }
    .log-entry .log-time { color: rgba(212,175,55,.6); margin-right: 8px; }

    /* ---------- 结局 ---------- */
    .ending-card { background: var(--paper-bg); border: 3px solid var(--imperial-gold); border-radius: 16px; padding: 40px; box-shadow: 0 15px 40px rgba(0,0,0,.5); animation: fadeIn .8s ease-out; }
    .ending-card h2 { text-align: center; font-size: 2.3em; color: var(--imperial-red); margin-bottom: 8px; letter-spacing: 8px; }
    .ending-rank { text-align: center; font-size: 1.5em; color: var(--imperial-gold); margin-bottom: 26px; letter-spacing: 4px; }
    .ending-card .ending-body { font-size: 1.08em; line-height: 2.1; text-indent: 2em; color: #2a2a2a; }
    .score-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin: 26px 0; }
    .score-box { background: rgba(255,255,255,.7); border: 1px solid rgba(212,175,55,.6); border-radius: 10px; padding: 14px; text-align: center; }
    .score-box .k { color: #777; font-size: .85em; letter-spacing: 2px; }
    .score-box .v { font-size: 1.5em; font-weight: bold; color: var(--imperial-red); }
    .fates { background: rgba(0,0,0,.04); border-radius: 10px; padding: 18px 22px; margin: 24px 0; }
    .fates h4 { color: var(--imperial-red); letter-spacing: 3px; margin-bottom: 12px; font-size: 1.05em; }
    .fate-line { display: flex; gap: 12px; padding: 7px 0; border-bottom: 1px dashed rgba(0,0,0,.1); font-size: .97em; line-height: 1.7; }
    .fate-line:last-child { border-bottom: none; }
    .fate-who { width: 92px; flex: none; font-weight: bold; color: #444; }
    .fate-what { flex: 1; color: #333; }
    .ending-actions { text-align: center; margin-top: 30px; }
    .ending-actions button {
        padding: 13px 46px; font-size: 1.08em; cursor: pointer; font-family: inherit; letter-spacing: 5px;
        background: linear-gradient(135deg, var(--imperial-red) 0%, #a51a1a 100%); color: var(--imperial-gold);
        border: 2px solid var(--imperial-gold); border-radius: 8px; transition: all .3s;
    }
    .ending-actions button:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(212,175,55,.4); }

    .warn {
        background: rgba(196,30,58,.12); border-left: 4px solid var(--seal-red); color: #f0c9cf;
        padding: 12px 16px; border-radius: 6px; font-size: .92em; margin: 14px 0; display: none;
    }
    .warn.show { display: block; }


    /* ---------- 密折抉择 ---------- */
    .mize-choice { background: rgba(40,40,40,.06); border: 1px dashed rgba(212,175,55,.85); border-radius: 10px; padding: 18px 20px; margin: 18px 0; }
    .mize-choice-text { color: #4a4a4a; line-height: 1.95; font-size: .98em; }
    .mize-choice-text b { color: var(--imperial-red); }
    .mize-choice-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
    .skip-btn {
        display: inline-block; padding: 10px 22px; margin: 6px 0;
        background: linear-gradient(135deg, #efece2 0%, #ded9c9 100%); color: #5a5548;
        border: 1px solid #b9b29a; border-radius: 6px; cursor: pointer; font-size: .98em; font-family: inherit;
        transition: all .3s;
    }
    .skip-btn:hover { background: linear-gradient(135deg, #f6f3e9 0%, #e8e2d0 100%); transform: translateY(-2px); }
    .mize.sealed { display: block; background: linear-gradient(135deg, #efeee8 0%, #e6e4dc 100%); border-left-color: #999; }
    .mize.sealed .mize-text { color: #777; font-style: italic; }
    .option-tag { display: inline-block; margin-top: 8px; padding: 3px 10px; font-size: .78em; letter-spacing: 1px; color: #6b4f16; background: rgba(212,175,55,.28); border-radius: 10px; }


    /* 密折抉择：代价表 */
    .mize-cost-table { margin-top: 14px; border: 1px solid rgba(120,100,40,.35); border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.55); }
    .mct-row { display: grid; grid-template-columns: 84px 56px 56px 1fr; gap: 8px; align-items: start; padding: 9px 12px; border-bottom: 1px dashed rgba(120,100,40,.28); font-size: .9em; line-height: 1.7; }
    .mct-row:last-child { border-bottom: none; }
    .mct-head { background: rgba(212,175,55,.22); font-weight: bold; color: #4a3a10; letter-spacing: 1px; }
    .mct-k { font-weight: bold; color: var(--imperial-red); }
    .mct-up { color: #1f7a4d; font-weight: bold; }
    .mct-down { color: #9a6a1c; font-weight: bold; }
    .mct-d { color: #555; }
    .mct-d b { color: #333; }
    .mct-d b.warntxt, .warntxt { color: var(--seal-red); }
    .mize-current { margin-top: 12px; font-size: .88em; color: #6a6355; letter-spacing: 1px; }
    .mize-current b { color: var(--imperial-red); }
    .reveal-btn em, .skip-btn em { display: block; font-style: normal; font-size: .78em; opacity: .85; letter-spacing: 1px; margin-top: 3px; }
    .mize-cost { margin-top: 12px; padding-top: 10px; border-top: 1px dashed rgba(120,100,40,.3); font-size: .88em; color: #6a6355; letter-spacing: 1px; }
    /* 圣心二端 */
    .heart-note { font-size: .78em; color: rgba(240,236,224,.55); margin: -4px 0 10px 92px; letter-spacing: 1px; }
    @media (max-width: 640px) { .heart-note { margin-left: 74px; } .mct-row { grid-template-columns: 70px 44px 44px 1fr; font-size: .84em; } }

    /* ---------- 支线事件 ---------- */
    .event-card {
        background: linear-gradient(135deg, #fdfaf2 0%, #f4f0e3 100%);
        border: 3px solid #8a7f66; border-radius: 16px; padding: 34px; margin-bottom: 26px;
        box-shadow: 0 15px 40px rgba(0,0,0,.5); position: relative; animation: slideIn .5s ease-out;
    }
    .event-card[data-tag="灾异"] { border-color: #2e6b5e; }
    .event-card[data-tag="言官"] { border-color: #7b3fa0; }
    .event-card[data-tag="宗室"] { border-color: #b8860b; }
    .event-card[data-tag="边事"] { border-color: #8b0000; }
    .event-card[data-tag="民变"], .event-card[data-tag="民生"] { border-color: #3b5f8a; }
    .event-ribbon {
        position: absolute; top: -16px; left: 34px; padding: 6px 18px;
        background: #4a4636; color: var(--imperial-gold); font-size: .9em; letter-spacing: 3px;
        border-radius: 6px; border: 2px solid var(--imperial-gold); box-shadow: 0 4px 12px rgba(0,0,0,.4);
    }
    .event-card .memorial-from { color: #4a4636; }
    .event-card .memorial-title::after { content: ''; }
    .reform-fill.alt { background: linear-gradient(90deg, #2e6b5e, #7fb8a6); }
    .reform-track.axis { position: relative; }
    .reform-track.axis .axis-mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: rgba(212,175,55,.75); }
    .reform-fill.axisfill { position: absolute; top: 0; bottom: 0; }
    .reform-fill.axisfill.sev { background: linear-gradient(90deg, rgba(196,30,58,.45), var(--seal-red)); }
    .reform-fill.axisfill.mer { background: linear-gradient(90deg, #4f8f7e, rgba(127,184,166,.5)); }

    @media (max-width: 768px) {
        h1.title { font-size: 2.2em; letter-spacing: 8px; }
        .splash h1 { font-size: 2.4em; letter-spacing: 8px; }
        .stats-panel { grid-template-columns: repeat(2, 1fr); }
        .memorial-card { padding: 24px; }
        .reform-name, .person-name { width: 74px; font-size: .88em; }
        .fate-who { width: 74px; }
    }
</style>
</head>
<body>
<div class="splash" id="splash">
    <h1>批红 · 雍正十三年</h1>
    <div class="sub">雍正元年（1723）至雍正十三年（1735）</div>
    <div class="hint">

/* ============================================================
   游戏逻辑 v2
   —— 密折「阅 / 不阅」信息差：阅之则解锁「知情方略」选项；不阅而选，

   —— 支线事件：奏折之间可触发天灾 / 言官 / 宗室 / 边事 / 民生事件。

   ============================================================ */
const YEAR_NAMES = ['元年','二年','三年','四年','五年','六年','七年','八年','九年','十年','十一年','十二年','十三年'];

const INITIAL_OFFICIALS = {
    zhangTingyu: 80, tianWenjing: 70, yunxiang: 60, longkodo: 40,
    nianGengyao: 50, yinsi: -50, eertai: 40, liwei: 30
};

const gameState = {
    index: 0,
    year: 1723, month: 8,
    treasury: 800, publicSupport: 60, officialMorale: 50,
    imperialPower: 50, militaryStrength: 55,
    secretMemorials: 0,   // 已阅密折
    mizeSkipped: 0,       // 封还不阅
    mistakes: 0,          // 事后追悔
    eventCount: 0,
    reforms: { huohao: 0, tandin: 0, tuigu: 0 },
    meter: { severity: 45, mercy: 50, integrity: 40, resentment: 40, insight: 20, suspicion: 30 },
    officials: Object.assign({}, INITIAL_OFFICIALS),
    mizeState: {},        // 奏折序号 -> 'read' | 'skipped'
    log: [],
    queue: []             // 待处理事件
};

const LIMITS = {
    treasury: [0, 3000],
    publicSupport: [0, 100],
    officialMorale: [0, 100],
    imperialPower: [0, 100],
    militaryStrength: [0, 100],
    severity: [0, 100],
    mercy: [0, 100],
    integrity: [0, 100],
    resentment: [0, 100],
    insight: [0, 100],
    suspicion: [0, 100]
};

function clamp(key, v) {
    const lim = LIMITS[key];
    if (!lim) return v;
    return Math.max(lim[0], Math.min(lim[1], v));
}
function clampRaw(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function yearLabel(y) {
    const idx = y - 1723;
    return '雍正' + (YEAR_NAMES[idx] || (idx + 1) + '年') + '（' + y + '）';
}

/* ---------- 启动 ---------- */
function startGame() {
    document.getElementById('splash').classList.add('hidden');
    document.getElementById('container').style.display = 'block';
    updateAll();
    showMemorial();
}

function updateAll() {
    updateYear(); updateStats(); updateReforms(); updatePeople(); updateHeart();
    updateProgress(); updateWarning();
}
function updateYear() { document.getElementById('yearDisplay').textContent = yearLabel(gameState.year); }

function updateProgress() {
    const total = gameData.length;
    const done = gameState.index;
    document.getElementById('progressFill').style.width = (total ? done / total * 100 : 0) + '%';
    document.getElementById('progressLabel').textContent =
        '第 ' + Math.min(done + 1, total) + ' / ' + total + ' 折　·　阅密折 ' + gameState.secretMemorials +
        '　·　支线 ' + gameState.eventCount + ' 事';
}

function updateStats() {
    const stats = [
        { label: '国库', value: Math.round(gameState.treasury) + '万两', max: 3000, current: gameState.treasury },
        { label: '民心', value: gameState.publicSupport, max: 100, current: gameState.publicSupport },
        { label: '官风', value: gameState.officialMorale, max: 100, current: gameState.officialMorale },
        { label: '皇权', value: gameState.imperialPower, max: 100, current: gameState.imperialPower },
        { label: '军力', value: gameState.militaryStrength, max: 100, current: gameState.militaryStrength },
        { label: '密折', value: '阅 ' + gameState.secretMemorials + ' · 封 ' + gameState.mizeSkipped, max: 50, current: gameState.secretMemorials, plain: true }
    ];
    document.getElementById('statsPanel').innerHTML = stats.map(s => {
        const w = s.plain ? 0 : Math.max(0, Math.min(100, (s.current / s.max) * 100));
        const danger = !s.plain && (s.current <= 20);
        return '<div class="stat-card' + (danger ? ' danger' : '') + '">' +
            '<div class="stat-label">' + s.label + '</div>' +
            '<div class="stat-value">' + s.value + '</div>' +
            '<div class="stat-bar"><div class="stat-bar-fill" style="width:' + w + '%"></div></div>' +
        '</div>';
    }).join('');
}

const REFORM_META = [
    { key: 'huohao', name: '火耗归公' },
    { key: 'tandin', name: '摊丁入亩' },
    { key: 'tuigu',   name: '改土归流' }
];

    { key: 'integrity',  name: '吏治清' },
    { key: 'resentment', name: '民 怨' }
];
const HEART_META = [
    { key: 'insight',    name: '明 察', note: '阅密折则明，不阅则闇；明察 ≥40 则新政之效加三成，≥70 加五成' },

    document.getElementById('reformPanel').innerHTML = REFORM_META.map(r =>
        '<div class="reform-row"><div class="reform-name">' + r.name + '</div>' +
        '<div class="reform-track"><div class="reform-fill" style="width:' + gameState.reforms[r.key] + '%"></div></div>' +
        '<div class="reform-num">' + gameState.reforms[r.key] + '%</div></div>').join('');
    const style = gameState.meter.severity - gameState.meter.mercy;

        '<div class="reform-row"><div class="reform-name">取 向</div>' +
        '<div class="reform-track axis"><div class="axis-mid"></div>' +
        '<div class="reform-fill axisfill ' + (style >= 0 ? 'sev' : 'mer') + '" style="left:' + left + '%;width:' + half + '%"></div></div>' +
        '<div class="reform-num">' + (style > 0 ? '偏严' : style < 0 ? '偏宽' : '持平') + '</div></div>';
    document.getElementById('meterPanel').innerHTML = axisRow + METER_META.map(r =>
        '<div class="reform-row"><div class="reform-name">' + r.name + '</div>' +
        '<div class="reform-track"><div class="reform-fill alt" style="width:' + gameState.meter[r.key] + '%"></div></div>' +
        '<div class="reform-num">' + gameState.meter[r.key] + '</div></div>').join('');

    const box = document.getElementById('heartPanel');

        '<div class="reform-row"><div class="reform-name">' + r.name + '</div>' +

function updatePeople() {
    document.getElementById('peoplePanel').innerHTML = OFFICIALS.map(o => {

            '<div class="person-track"><div class="person-fill ' + (pos ? 'pos' : 'neg') + '" style="left:' + left + '%;width:' + w + '%"></div></div>' +
            '<div class="person-val' + (pos ? '' : ' neg') + '">' + (v > 0 ? '+' : '') + v + '</div></div>';
    }).join('');

function updateWarning() {
    const msgs = [];
    if (gameState.treasury < 100) msgs.push('国库将竭，赏罚无所出，官必有怨。');
    if (gameState.publicSupport < 20) msgs.push('民心已失，号令不出于州县。');
    if (gameState.imperialPower < 25) msgs.push('皇权削弱，宗室与外臣皆轻朝廷。');
    if (gameState.militaryStrength < 25) msgs.push('边备空虚，藩篱可虞。');
    if (gameState.meter.severity >= 75) msgs.push('峻法过甚，吏胥转相为恶，苛政之名将及朕身。');
    if (gameState.meter.mercy >= 80) msgs.push('宽而无断，政事日弛，弊政因循。');
    if (gameState.meter.resentment >= 70) msgs.push('民怨沸腾，苛政之名将及朕身。');
    if (gameState.meter.suspicion >= 70) msgs.push('密报日多，疑心日重；臣下人人自危，忠言亦不敢尽。');
    if (gameState.meter.insight < 18) msgs.push('久不阅密折，朕于外事竟不之知，全凭他人之口。');
    const wb = document.getElementById('warningBox');
    if (!wb) return;
    wb.innerHTML = msgs.map(m => '<div class="warn show">' + m + '</div>').join('');
}

    let mizeHtml = '';
    if (m.mize) {
        if (!st) {
            const ins = gameState.meter.insight, sus = gameState.meter.suspicion;
            const over = Math.max(0, sus - 50);
            mizeHtml =
                '<div class="mize-choice">' +
                    '<div class="mize-choice-text">此折另有关键之处。<b>查阅密折</b>则隐情得明、解锁「知情方略」，然密报日多则疑心日重；' +
                    '<b>封还不阅</b>则所见止于表面，然不疑人则不伤忠直。密折之代价，明列如下：</div>' +
                    '<div class="mize-cost-table">' +
                        '<div class="mct-row mct-head"><span>抉择</span><span>明察</span><span>猜忌</span><span>其余影响</span></div>' +
                        '<div class="mct-row"><span class="mct-k">查阅密折</span>' +
                            '<span class="mct-up">+3</span><span class="mct-up">+3</span>' +
                            '<span class="mct-d">解锁「知情方略」选项；' +
                            (ins >= 70 ? '明察既高，所行新政之效加五成。' : ins >= 40 ? '明察既高，所行新政之效加三成。' : '明察若至 40，所行新政之效加三成，至 70 加五成。') +
                            (over > 0
                                ? '猜忌过五十，每作一策耗官风 <b>' + (over * 0.25).toFixed(1) + '</b>，' +
                                  '忠臣（张廷玉、怡亲王、鄂尔泰、李卫、田文镜）之心各耗 <b>' + (over * 0.12).toFixed(1) + '</b>，' +
                                  '允禩、年羹尧、隆科多各得 <b>' + (over * 0.08).toFixed(1) + '</b>；'

                            '封还累计 ' + gameState.mizeSkipped + ' 封。</span></div>' +

                    '<div class="mize-choice-btns">' +
                        '<button class="reveal-btn" onclick="readMize()">查 阅 密 折<em>明察 +3 · 猜忌 +3</em></button>' +
                        '<button class="skip-btn" onclick="skipMize()">封 还 不 阅<em>明察 −1 · 猜忌 −2</em></button>' +

                    '<div class="mize-current">当前：明察 <b>' + ins + '</b> · 猜忌 <b>' + sus + '</b>　|　已阅 ' + gameState.secretMemorials + ' 封 · 已封还 ' + gameState.mizeSkipped + ' 封</div>' +
                '</div>';
        } else if (st === 'read') {
            mizeHtml = '<div class="mize revealed"><div class="mize-label">【密折】</div><div class="mize-text">' + m.mize + '</div>' +
                    '<div class="mize-cost">明察 ' + gameState.meter.insight + ' · 猜忌 ' + gameState.meter.suspicion + '</div></div>';
        } else {
            mizeHtml = '<div class="mize sealed"><div class="mize-label">【密折】</div><div class="mize-text">此折已封还，朕竟未之阅，其中隐情未知也。</div>' +
                    '<div class="mize-cost">明察 ' + gameState.meter.insight + ' · 猜忌 ' + gameState.meter.suspicion + '</div></div>';
        }
    }

    const opts = visibleOptions(m, idx);
    const optHtml = opts.map((o, i) =>
        '<button class="option-btn" onclick="selectOption(' + i + ')">' +

            mizeHtml +
            '<div class="options">' + optHtml + '</div>' +
        '</div>';
    if (gameState.index > 0) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function readMize() {
    const idx = gameState.index;
    if (gameState.mizeState[idx]) return;
    gameState.mizeState[idx] = 'read';
    gameState.secretMemorials++;
    gameState.meter.insight = clamp('insight', gameState.meter.insight + 3);
    gameState.meter.suspicion = clamp('suspicion', gameState.meter.suspicion + 3);
    addLog(gameData[idx].year, gameData[idx].month, '查阅密折：明察 +3，猜忌 +3。');
    updateStats(); updateProgress(); updateHeart();
    showMemorial();
}

function skipMize() {
    const idx = gameState.index;
    if (gameState.mizeState[idx]) return;
    gameState.mizeState[idx] = 'skipped';
    gameState.mizeSkipped++;
    gameState.meter.insight = clamp('insight', gameState.meter.insight - 1);
    gameState.meter.suspicion = clamp('suspicion', gameState.meter.suspicion - 2);
    addLog(gameData[idx].year, gameData[idx].month, '封还不阅：明察 −1，猜忌 −2。');
    updateStats(); updateProgress(); updateHeart();
    showMemorial();
}

function selectOption(i) {
    const idx = gameState.index;
    const m = gameData[idx];
    const opts = visibleOptions(m, idx);
    const opt = opts[i];
    if (!opt) return;

    applyEffects(opt.effects);
    addLog(m.year, m.month, opt.log);

    // 信息差惩罚：未阅密折而选此策，事后追悔
    if (opt.blindRisk && gameState.mizeState[idx] !== 'read') {
        gameState.mistakes++;
        const blind = gameState.meter.insight < 25;
        const pen = blind ? { imperialPower: -5, officialMorale: -5 } : { imperialPower: -3, officialMorale: -3 };
        applyPenalty(pen);
        addLog(m.year, m.month, blind
            ? '事后始知其中另有隐情；朕久不阅密折，闇于外事，虽悔亦晚，自认受蔽。'
            : '事后始知其中另有隐情，朕自认受蔽，悔之。');
    }

    gameState.index++;
    updateAll();
    afterMemorial(idx);
}

function applyPenalty(obj) {
    for (const key in obj) {
        const val = obj[key];
        if (key === 'treasury') gameState.treasury = Math.max(0, Math.min(3000, gameState.treasury + val));
        else gameState[key] = clamp(key, (gameState[key] || 0) + val);
    }
}

function applyEffects(effects) {
    const sev0 = gameState.meter.severity, mer0 = gameState.meter.mercy;
    const insNow = gameState.meter.insight;
    const reformMult = insNow >= 70 ? 1.5 : insNow >= 40 ? 1.3 : 1.0;   // 明察加成：所行新政之效
    for (const key in effects) {
        let val = effects[key];
        if (key.startsWith('reforms.') && val > 0) val = Math.round(val * reformMult);
        if (key.startsWith('officials.')) {
            const n = key.split('.')[1];
            gameState.officials[n] = clampRaw((gameState.officials[n] || 0) + val, -100, 100);
        } else if (key.startsWith('reforms.')) {
            const n = key.split('.')[1];
            gameState.reforms[n] = clampRaw((gameState.reforms[n] || 0) + val, 0, 100);
        } else if (key === 'severity' || key === 'mercy' || key === 'integrity' || key === 'resentment') {
            gameState.meter[key] = clamp(key, (gameState.meter[key] || 0) + val);
        } else if (LIMITS[key]) {
            gameState[key] = clamp(key, (gameState[key] || 0) + val);
        } else if (key === 'secretMemorials') {
            gameState.secretMemorials = Math.max(0, gameState.secretMemorials + val);
        }
    }
    // 民怨自动派生：峻法则怨，怀柔则怨消
    // —— 圣心二端的派生 ——
    const ins = gameState.meter.insight, sus = gameState.meter.suspicion;
    if (ins >= 40) gameState.meter.integrity = clamp('integrity', gameState.meter.integrity + Math.floor(ins / 40));
    const over = Math.max(0, sus - 50);          // 猜忌之害，过五十而渐显
    if (over > 0) {
        gameState.officialMorale = clamp('officialMorale', gameState.officialMorale - over * 0.25);
        ['zhangTingyu', 'yunxiang', 'eertai', 'liwei', 'tianWenjing'].forEach(k =>
            gameState.officials[k] = clampRaw((gameState.officials[k] || 0) - over * 0.12, -100, 100));
        ['yinsi', 'nianGengyao', 'longkodo'].forEach(k =>
            gameState.officials[k] = clampRaw((gameState.officials[k] || 0) + over * 0.08, -100, 100));
    }
    const dSus = 0.4 * (gameState.meter.severity - sev0) - 0.4 * (gameState.meter.mercy - mer0);
    gameState.meter.suspicion = clamp('suspicion', gameState.meter.suspicion + dSus);
    if (gameState.meter.suspicion >= 60) {
        gameState.meter.insight = clamp('insight', gameState.meter.insight - Math.ceil((gameState.meter.suspicion - 60) / 10));
    }

    const dRes = 0.5 * (gameState.meter.severity - sev0) - 0.5 * (gameState.meter.mercy - mer0);
    gameState.meter.resentment = clamp('resentment', gameState.meter.resentment + dRes);
}

function addLog(y, mo, msg) {
    gameState.log.unshift({ y: y, m: mo, msg: msg });
    if (gameState.log.length > 50) gameState.log.pop();
    const list = document.getElementById('logList');
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = '<span class="log-time">' + y + '年' + mo + '月</span>' + msg;
    list.insertBefore(entry, list.firstChild);
    while (list.children.length > 50) list.removeChild(list.lastChild);
}

/* ---------- 支线事件 ---------- */
let randomPool = [];

function afterMemorial(doneIdx) {
    const curated = SCHEDULED[doneIdx];
    if (curated) {
        curated.forEach(e => gameState.queue.push(e));
    } else if (Math.random() < 0.26) {
        if (!randomPool.length) randomPool = RANDOM_EVENTS.slice();
        const pick = randomPool.splice(Math.floor(Math.random() * randomPool.length), 1)[0];
        const ev = JSON.parse(JSON.stringify(pick));
        ev.year = gameState.year; ev.month = gameState.month;
        gameState.queue.push(ev);
    }
    processQueue();
}

function processQueue() {
    if (gameState.queue.length) {
        showEvent(gameState.queue.shift());
        return;
    }
    showMemorial();
}

function showEvent(ev) {
    const box = document.getElementById('memorialContainer');
    gameState.currentEvent = ev;
    gameState.year = ev.year; gameState.month = ev.month;
    updateYear();

    const opts = ev.options.map((o, i) =>
        '<button class="option-btn" onclick="selectEventOption(' + i + ')">' +
            '<div class="option-label">' + (i + 1) + '. ' + o.label + '</div>' +
            (o.hint ? '<div class="option-hint">※ ' + o.hint + '</div>' : '') +
        '</button>').join('');

    box.innerHTML =
        '<div class="event-card" data-tag="' + ev.tag + '">' +
            '<div class="event-ribbon">' + (ev.tagName || '邸报') + '</div>' +
            '<div class="memorial-meta">' +
                '<div class="memorial-from">' + ev.from + '</div>' +
                '<div class="memorial-date">' + yearLabel(ev.year) + ' ' + ev.month + '月</div>' +
            '</div>' +
            '<div class="memorial-title">' + ev.title + '</div>' +
            '<div class="memorial-summary">' + ev.summary + '</div>' +
            '<div class="memorial-body">' + ev.body + '</div>' +
            '<div class="options">' + opts + '</div>' +
        '</div>';
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function selectEventOption(i) {
    const ev = gameState.currentEvent;
    const opt = ev.options[i];
    if (!opt) return;
    applyEffects(opt.effects);
    addLog(ev.year, ev.month, opt.log);
    gameState.eventCount++;
    updateAll();
    processQueue();
}

/* ---------- 结局 ---------- */

                scoreBox('百官归心', Math.round(oAvg)) +
            '</div>' +
            '<div class="fates"><h4>人 事 终 局</h4>' +
                fates.map(f => '<div class="fate-line"><div class="fate-who">' + f.who + '</div><div class="fate-what">' + f.what + '</div></div>').join('') +
            '</div>' +
            '<div class="ending-actions"><button onclick="restartGame()">重 开 天 命</button></div>' +
        '</div>';
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressLabel').textContent = '十三载已终 · ' + gameData.length + ' 折阅毕';
}

function scoreBox(k, v) {
    return '<div class="score-box"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
}

function buildFates(o) {
    const out = [];
    out.push({ who: '怡亲王允祥', what: o.yunxiang >= 60
        ? '鞠躬尽瘁，为皇上最心腹之臣。雍正八年薨，年仅四十四，皇上辍朝三日，终身悼之。'
        : '为皇上总理事务多年，积劳成疾。雍正八年薨，年仅四十四。' });
    out.push({ who: '张廷玉', what: o.zhangTingyu >= 70
        ? '始终倚为股肱，谨慎廉洁。乾隆时以大学士主持朝政，至乾隆四年方以年老致仕，十年而卒。'
        : '晚年办事渐形倚重，乾隆时罢黜，居家以终。' });
    out.push({ who: '田文镜', what: o.tianWenjing >= 60
        ? '清峻刻核，推行火耗归公最有功。雍正十三年五月病卒于河南任所，家无余财。'
        : '以严刻得怨，雍正十三年病卒河南，士论毁誉参半。' });
    out.push({ who: '鄂尔泰', what: o.eertai >= 60
        ? '经理西南，改土归流之功，亘古未有。雍正十三年三月病卒，年六十八，雍正为之震悼。'
        : '雍正十三年三月病卒于任，年六十八。所行苗政，后世毁誉不一。' });
    out.push({ who: '年羹尧', what: o.nianGengyao >= 55
        ? '受赏封爵，望无两。然骄盈不改，雍正三年以数十款罪状赐死于历城狱中。朕之识人，止于此耳。'
        : (o.nianGengyao <= -45
            ? '雍正二年即被夺爵下狱，逾年赐死。朕用之而不疑其骄，终至如此。'
            : '雍正二年夺爵，圈禁逾年而卒，籍没家产。') });
    out.push({ who: '隆科多', what: o.longkodo <= -45
        ? '雍正元年十二月圈禁，翌年五月死于狱中，家产尽入官。其党俱坐。'
        : '雍正元年以罪圈禁，雍正二年五月卒，年五十一。' });
    out.push({ who: '允禩', what: o.yinsi <= -40
        ? '雍正四年削爵，改名阿其那，圈禁宗人府，逾年死于幽禁。朕之宗室政策自此严矣。'
        : '雍正四年削爵禁锢，终身不复出。' });
    out.push({ who: '李卫', what: o.liwei >= 55
        ? '历官浙、闽、云、陕，办事干练。雍正十三年十一月卒，年六十一。'
        : '雍正十三年卒。历任虽多，时人亦以其刻而毁之。' });
    return out;
}

function restartGame() {
    gameState.index = 0;
    gameState.year = 1723; gameState.month = 8;
    gameState.treasury = 800; gameState.publicSupport = 60; gameState.officialMorale = 50;
    gameState.imperialPower = 50; gameState.militaryStrength = 55;
    gameState.secretMemorials = 0; gameState.mizeSkipped = 0; gameState.mistakes = 0;
    gameState.eventCount = 0;
    gameState.reforms = { huohao: 0, tandin: 0, tuigu: 0 };
    gameState.meter = { severity: 45, mercy: 50, integrity: 40, resentment: 40 };
    gameState.officials = Object.assign({}, INITIAL_OFFICIALS);
    gameState.mizeState = {};
    gameState.log = [];
    gameState.queue = [];
    randomPool = [];
    document.getElementById('logList').innerHTML = '';
    updateAll();
    showMemorial();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- 键盘 ---------- */
document.addEventListener('keydown', function (e) {
    if (gameState.index >= gameData.length) return;
    if (e.key === 'm' || e.key === 'M') {
        const idx = gameState.index;
        if (gameData[idx] && gameData[idx].mize && !gameState.mizeState[idx]) { readMize(); return; }
    }
    if (e.key === '1' || e.key === '2' || e.key === '3') {
        const i = parseInt(e.key, 10) - 1;
        const m = gameData[gameState.index];
        if (m && visibleOptions(m, gameState.index)[i]) selectOption(i);
    }
});

document.getElementById('startBtn').addEventListener('click', startGame);

</script>
